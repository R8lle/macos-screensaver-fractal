name: FractalSaver
options:
  bundleIdPrefix: de.r8lle.screensaver
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: YOUR_TEAM_ID
    Release:
      ONLY_ACTIVE_ARCH: NO
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: YOUR_TEAM_ID
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  FractalSaver:
    type: bundle
    platform: macOS
    productName: FractalSaver
    sources:
      - path: Sources
      - path: Shaders
      - path: Resources
        buildPhase: resources
        excludes:
          - thumbnail-full.png
          - thumbnail-large.png
          - window-capture.png
          - .DS_Store
    settings:
      base:
        WRAPPER_EXTENSION: saver
        PRODUCT_BUNDLE_IDENTIFIER: de.r8lle.screensaver.fractal
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        COMBINE_HIDPI_IMAGES: NO
        MTL_FAST_MATH: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: "1.0"
        FRAMEWORK_SEARCH_PATHS: "$(inherited)"
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Cocoa.framework

schemes:
  FractalSaver:
    build:
      targets:
        FractalSaver: all
    run:
      config: Debug
